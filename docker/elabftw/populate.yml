# db:populate config for the MetaRelay dev/CI eLabFTW instance.
skip_confirm: true
generate_random_experiments: false
generate_random_resources: false
teams:
  - name: MetaRelay
    users:
      - email: metarelay@example.org
        password: metarelay-dev-password
        firstname: Meta
        lastname: Relay
        api_key: metarelay-dev-key
    # MetaRelay never creates categories. The examples write into
    # "Fiber study", the tests into "MetaRelay tests".
    experiments_categories:
      - name: Fiber study
      - name: MetaRelay tests
    resources_categories:
      - name: Fiber study
      - name: MetaRelay tests
