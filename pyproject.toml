[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "metarelay"
version = "0.1.0.dev0"
description = "A backend-agnostic Python interface for writing NWB metadata to electronic lab notebooks, GitHub, and local disk."
readme = "README.md"
license = "CC0-1.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
labarchives = ["labapi>=1.0.3,<2"]
elabftw = ["elabapi-python>=5,<7"]
github = ["httpx>=0.28,<1"]
nwb = [
    "pynwb>=4.1,<5",
    "ndx-fiber-photometry>=0.2.3,<0.3",
    "ndx-microscopy>=0.4,<0.5",
    "ndx-ophys-devices>=0.4,<0.5",
]
testing = ["pytest>=9"]
all = ["metarelay[labarchives,elabftw,github,nwb,testing]"]

[project.urls]
Repository = "https://github.com/nimh-dsst/MetaRelay"
Issues = "https://github.com/nimh-dsst/MetaRelay/issues"

[dependency-groups]
dev = [
    "packaging>=25",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metarelay"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
