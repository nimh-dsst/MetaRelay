[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "metarelay"
version = "0.1.0.dev0"
description = "A backend-agnostic Python interface for writing NWB metadata to electronic lab notebooks, GitHub, and local disk."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.14,<3",
]

[project.optional-dependencies]
# 1.2.0 is the first labapi that reads the error code LabArchives nests inside
# the API class root. Without it a bad login is not an authentication error.
labarchives = ["labapi>=1.2.0,<2"]
elabftw = ["elabapi-python>=6,<7"]
github = ["httpx>=0.28,<1"]
nwb = [
    "pynwb>=4.1,<5",
    "ndx-fiber-photometry>=0.2.3,<0.3",
    "ndx-microscopy>=0.4,<0.5",
    "ndx-ophys-devices>=0.4,<0.5",
]
testing = ["pytest>=9"]
all = ["metarelay[labarchives,elabftw,github,nwb,testing]"]

[project.scripts]
metarelay = "metarelay.cli:main"

[project.entry-points."metarelay.backends"]
file = "metarelay.backends.local:LocalBackend"
labarchives = "metarelay.backends.labarchives:LabArchivesBackend"
elabftw = "metarelay.backends.elabftw:ElabFTWBackend"
github = "metarelay.backends.github:GitHubBackend"

[project.urls]
Documentation = "https://nimh-dsst.github.io/MetaRelay/"
Repository = "https://github.com/nimh-dsst/MetaRelay"
Issues = "https://github.com/nimh-dsst/MetaRelay/issues"

[dependency-groups]
dev = [
    "packaging>=25",
    "pytest>=9.0.3",
    "pytest-cov>=6",
    "ruff>=0.15.12",
]
docs = [
    "myst-parser>=5.2.0",
    "pydata-sphinx-theme>=0.24.0",
    "sphinx>=9.1.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metarelay"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/pyproject.toml",
    "/uv.lock",
    "/.python-version",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root, so tests can import the runnable examples in examples/.
pythonpath = ["."]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["metarelay"]
# The fakes and the conformance suite are test tools, not shipped behavior.
omit = ["*/metarelay/testing/*"]

[tool.coverage.report]
# CI's all-extras run has no eLabFTW server, so most of the eLabFTW backend is
# covered only by the separate eLabFTW job. Raise this as coverage grows.
fail_under = 87

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "."]  # "." for the examples package

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
